<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML File Saver</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #1e1e1e;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 320px;
            background-color: #252526;
            border-right: 1px solid #3e3e42;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, width 0.3s ease;
            z-index: 100;
            overflow: hidden;
        }

        .sidebar.collapsed {
            transform: translateX(-100%);
            width: 0;
            min-width: 0;
            border-right: none;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .sidebar-header h2 {
            font-size: 16px;
            font-weight: 600;
        }

        .toggle-sidebar-btn {
            background: none;
            border: none;
            color: #858585;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .toggle-sidebar-btn:hover {
            background-color: #3e3e42;
            color: #e0e0e0;
        }

        .upload-section {
            padding: 16px;
            border-bottom: 1px solid #3e3e42;
            flex-shrink: 0;
        }

        .upload-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .file-input-label, .folder-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background-color: #0e639c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-weight: 500;
            font-size: 14px;
        }

        .file-input-label:hover, .folder-btn:hover {
            background-color: #1177bb;
        }

        #fileInput {
            display: none;
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .folder-item {
            padding: 12px;
            background-color: #2d2d30;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .folder-item:hover {
            background-color: #3e3e42;
        }

        .folder-item.expanded {
            background-color: #3e3e42;
        }

        .folder-toggle {
            font-size: 12px;
            width: 16px;
        }

        .folder-name {
            flex: 1;
            font-weight: 500;
        }

        .folder-actions {
            display: flex;
            gap: 4px;
        }

        .folder-delete-btn {
            background: none;
            border: none;
            color: #858585;
            cursor: pointer;
            padding: 4px;
            border-radius: 2px;
            transition: background-color 0.2s;
            font-size: 14px;
        }

        .folder-delete-btn:hover {
            background-color: #d13438;
            color: white;
        }

        .file-item {
            padding: 12px;
            background-color: #2d2d30;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            margin-bottom: 8px;
            margin-left: 24px;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .file-item:hover {
            background-color: #3e3e42;
            border-color: #007acc;
        }

        .file-item.active {
            background-color: #007acc;
            border-color: #007acc;
        }

        .file-item-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .file-item-name {
            font-weight: 500;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-item-size {
            font-size: 12px;
            opacity: 0.7;
        }

        .file-item-delete {
            background: none;
            border: none;
            color: #858585;
            cursor: pointer;
            padding: 4px;
            border-radius: 2px;
            transition: background-color 0.2s, color 0.2s;
            flex-shrink: 0;
            font-size: 16px;
        }

        .file-item-delete:hover {
            background-color: #d13438;
            color: white;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #1e1e1e;
        }

        .content-header {
            padding: 16px;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .content-header h1 {
            font-size: 16px;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .header-btn {
            padding: 8px 16px;
            background-color: #0e639c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 13px;
            font-weight: 500;
        }

        .header-btn:hover {
            background-color: #1177bb;
        }

        .header-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .frame-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1e1e1e;
            padding: 16px;
            overflow: hidden;
            position: relative;
        }

        .frame-wrapper {
            width: 100%;
            height: 100%;
            background-color: white;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #htmlFrame {
            flex: 1;
            border: none;
            width: 100%;
            height: 100%;
        }

        .placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #858585;
            font-size: 16px;
            text-align: center;
            padding: 32px;
        }

        #htmlFrame:fullscreen {
            width: 100vw;
            height: 100vh;
        }

        .frame-wrapper:fullscreen {
            width: 100vw;
            height: 100vh;
            border-radius: 0;
        }

        .file-list::-webkit-scrollbar {
            width: 8px;
        }

        .file-list::-webkit-scrollbar-track {
            background-color: #252526;
        }

        .file-list::-webkit-scrollbar-thumb {
            background-color: #464647;
            border-radius: 4px;
        }

        .file-list::-webkit-scrollbar-thumb:hover {
            background-color: #5c5c5c;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                height: 100%;
                left: 0;
                top: 0;
            }

            .sidebar.collapsed {
                transform: translateX(-100%);
            }
        }

        .toggle-main-btn {
            background: none;
            border: none;
            color: #858585;
            cursor: pointer;
            padding: 4px;
            display: none;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .toggle-main-btn:hover {
            background-color: #3e3e42;
            color: #e0e0e0;
        }

        @media (max-width: 768px) {
            .toggle-main-btn {
                display: flex;
            }
        }

        .error-message {
            background-color: #d13438;
            color: white;
            padding: 12px 16px;
            border-radius: 4px;
            margin-bottom: 8px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background-color: #252526;
            border: 1px solid #3e3e42;
            border-radius: 8px;
            padding: 24px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .modal-input {
            width: 100%;
            padding: 12px;
            background-color: #3e3e42;
            border: 1px solid #555;
            border-radius: 4px;
            color: #e0e0e0;
            font-family: inherit;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .modal-input:focus {
            outline: none;
            border-color: #007acc;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .modal-btn-primary {
            background-color: #0e639c;
            color: white;
        }

        .modal-btn-primary:hover {
            background-color: #1177bb;
        }

        .modal-btn-secondary {
            background-color: #3e3e42;
            color: #e0e0e0;
        }

        .modal-btn-secondary:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Files</h2>
                <button class="toggle-sidebar-btn" id="toggleSidebarBtn" title="Hide sidebar">
                    ◀
                </button>
            </div>

            <div class="upload-section">
                <div class="error-message" id="errorMessage"></div>
                <div class="upload-controls">
                    <label class="file-input-label">
                        Upload
                        <input type="file" id="fileInput" accept=".html,.htm" multiple>
                    </label>
                    <button class="folder-btn" id="newFolderBtn">+ Folder</button>
                </div>
            </div>

            <div class="file-list" id="fileList">
                <div class="placeholder">No files uploaded yet</div>
            </div>
        </div>

        <div class="content">
            <div class="content-header">
                <div style="display: flex; align-items: center; gap: 16px; flex: 1;">
                    <button class="toggle-main-btn" id="toggleMainBtn" title="Show sidebar">
                        ☰
                    </button>
                    <h1 id="currentFileName">HTML File Saver</h1>
                </div>
                <div class="header-actions">
                    <button class="header-btn" id="fullscreenBtn" disabled>Fullscreen</button>
                    <button class="header-btn" id="downloadBtn" disabled>Download</button>
                </div>
            </div>

            <div class="frame-container">
                <div class="frame-wrapper">
                    <div class="placeholder">Upload an HTML file to get started</div>
                    <iframe id="htmlFrame" style="display: none;" allow="keyboard *; pointer-lock *; fullscreen *; cross-origin-isolated" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-presentation allow-pointer-lock"></iframe>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="folderModal">
        <div class="modal-content">
            <div class="modal-header">Create New Folder</div>
            <input type="text" class="modal-input" id="folderNameInput" placeholder="Folder name" autocomplete="off">
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-secondary" id="cancelFolderBtn">Cancel</button>
                <button class="modal-btn modal-btn-primary" id="createFolderBtn">Create</button>
            </div>
        </div>
    </div>

    <div class="modal" id="labelModal">
        <div class="modal-content">
            <div class="modal-header">Save File As</div>
            <input type="text" class="modal-input" id="labelInput" placeholder="Label name" autocomplete="off">
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-secondary" id="cancelLabelBtn">Cancel</button>
                <button class="modal-btn modal-btn-primary" id="saveLabelBtn">Save</button>
            </div>
        </div>
    </div>

    <script>
        const sidebar = document.getElementById('sidebar');
        const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
        const toggleMainBtn = document.getElementById('toggleMainBtn');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const htmlFrame = document.getElementById('htmlFrame');
        const currentFileNameEl = document.getElementById('currentFileName');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const errorMessage = document.getElementById('errorMessage');
        const newFolderBtn = document.getElementById('newFolderBtn');
        const folderModal = document.getElementById('folderModal');
        const labelModal = document.getElementById('labelModal');
        const folderNameInput = document.getElementById('folderNameInput');
        const labelInput = document.getElementById('labelInput');

        const DB_NAME = 'HTMLFileSaverDB';
        const STORE_NAME = 'files';
        let db;
        let currentFileId = null;
        let pendingFolderId = null;

        async function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 2);

                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve();
                };

                request.onupgradeneeded = (e) => {
                    db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                    }
                };
            });
        }

        async function saveFile(name, content, folderId = null, label = null) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const file = {
                    name,
                    content,
                    label: label || name,
                    size: new Blob([content]).size,
                    folderId: folderId || null,
                    type: 'file',
                    timestamp: Date.now()
                };

                const request = store.add(file);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve(request.result);
            });
        }

        async function createFolder(folderName) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const folder = {
                    name: folderName,
                    type: 'folder',
                    expanded: true,
                    timestamp: Date.now()
                };

                const request = store.add(folder);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve(request.result);
            });
        }

        async function getAllItems() {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.getAll();

                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve(request.result);
            });
        }

        async function getItemById(id) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.get(id);

                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve(request.result);
            });
        }

        async function updateItem(id, updates) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                
                const getRequest = store.get(id);
                getRequest.onsuccess = () => {
                    const item = getRequest.result;
                    const updated = { ...item, ...updates };
                    const putRequest = store.put(updated);
                    putRequest.onerror = () => reject(putRequest.error);
                    putRequest.onsuccess = () => resolve(updated);
                };
                getRequest.onerror = () => reject(getRequest.error);
            });
        }

        async function deleteItem(id) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.delete(id);

                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve();
            });
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 5000);
        }

        async function renderFileList() {
            const items = await getAllItems();
            fileList.innerHTML = '';

            if (items.length === 0) {
                fileList.innerHTML = '<div class="placeholder">No files uploaded yet</div>';
                return;
            }

            const folders = items.filter(i => i.type === 'folder');
            const rootFiles = items.filter(i => i.type === 'file' && !i.folderId);

            folders.forEach(folder => {
                const folderItem = document.createElement('div');
                folderItem.className = 'folder-item' + (folder.expanded ? ' expanded' : '');
                folderItem.innerHTML = `
                    <span class="folder-toggle">${folder.expanded ? '▼' : '▶'}</span>
                    <span class="folder-name">${folder.name}</span>
                    <div class="folder-actions">
                        <button class="folder-delete-btn" data-id="${folder.id}">×</button>
                    </div>
                `;

                folderItem.querySelector('.folder-toggle').addEventListener('click', async (e) => {
                    e.stopPropagation();
                    await updateItem(folder.id, { expanded: !folder.expanded });
                    await renderFileList();
                });

                folderItem.querySelector('.folder-delete-btn').addEventListener('click', async (e) => {
                    e.stopPropagation();
                    await deleteItem(folder.id);
                    const folderFiles = items.filter(i => i.folderId === folder.id);
                    for (const file of folderFiles) {
                        await deleteItem(file.id);
                    }
                    await renderFileList();
                });

                fileList.appendChild(folderItem);

                if (folder.expanded) {
                    const folderFiles = items.filter(i => i.folderId === folder.id);
                    folderFiles.forEach(file => {
                        renderFileItem(file, fileList);
                    });
                }
            });

            rootFiles.forEach(file => {
                renderFileItem(file, fileList);
            });
        }

        function renderFileItem(file, parent) {
            const fileItem = document.createElement('div');
            fileItem.className = 'file-item';
            fileItem.innerHTML = `
                <div class="file-item-info">
                    <div class="file-item-name">${file.label}</div>
                    <div class="file-item-size">${formatFileSize(file.size)}</div>
                </div>
                <button class="file-item-delete" data-id="${file.id}">×</button>
            `;

            fileItem.addEventListener('click', (e) => {
                if (e.target.classList.contains('file-item-delete')) {
                    return;
                }
                loadFile(file.id, fileItem);
            });

            fileItem.querySelector('.file-item-delete').addEventListener('click', async (e) => {
                e.stopPropagation();
                await deleteItem(file.id);
                await renderFileList();
                htmlFrame.style.display = 'none';
                htmlFrame.parentElement.querySelector('.placeholder').style.display = 'flex';
                currentFileNameEl.textContent = 'HTML File Saver';
                fullscreenBtn.disabled = true;
                downloadBtn.disabled = true;
                currentFileId = null;
            });

            parent.appendChild(fileItem);
        }

        async function loadFile(id, fileItem) {
            const file = await getItemById(id);
            if (!file) return;

            currentFileId = id;
            document.querySelectorAll('.file-item').forEach(item => {
                item.classList.remove('active');
            });
            fileItem?.classList.add('active');

            currentFileNameEl.textContent = file.label;
            const placeholder = htmlFrame.parentElement.querySelector('.placeholder');
            placeholder.style.display = 'none';
            htmlFrame.style.display = 'block';

            const blob = new Blob([file.content], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            htmlFrame.src = url;

            fullscreenBtn.disabled = false;
            downloadBtn.disabled = false;

            if (window.innerWidth <= 768) {
                sidebar.classList.add('collapsed');
            }
        }

        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);

            for (const file of files) {
                const maxSize = 1024 * 1024 * 1024;
                if (file.size > maxSize) {
                    showError(`File "${file.name}" exceeds 1 GB limit`);
                    continue;
                }

                try {
                    const content = await file.text();
                    await saveFile(file.name, content, pendingFolderId);
                } catch (error) {
                    showError(`Failed to load file "${file.name}": ${error.message}`);
                }
            }

            fileInput.value = '';
            pendingFolderId = null;
            await renderFileList();
        });

        toggleSidebarBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
        });

        toggleMainBtn.addEventListener('click', () => {
            sidebar.classList.remove('collapsed');
        });

        fullscreenBtn.addEventListener('click', () => {
            if (htmlFrame.requestFullscreen) {
                htmlFrame.requestFullscreen().catch(err => console.error('Fullscreen error:', err));
            } else if (htmlFrame.webkitRequestFullscreen) {
                htmlFrame.webkitRequestFullscreen();
            }
        });

        downloadBtn.addEventListener('click', async () => {
            if (!currentFileId) return;
            const file = await getItemById(currentFileId);
            if (!file) return;

            const a = document.createElement('a');
            const blob = new Blob([file.content], { type: 'text/html' });
            a.href = URL.createObjectURL(blob);
            a.download = file.name;
            a.click();
        });

        newFolderBtn.addEventListener('click', () => {
            folderNameInput.value = '';
            folderModal.classList.add('show');
            folderNameInput.focus();
        });

        document.getElementById('createFolderBtn').addEventListener('click', async () => {
            const name = folderNameInput.value.trim();
            if (!name) {
                showError('Folder name cannot be empty');
                return;
            }
            await createFolder(name);
            folderModal.classList.remove('show');
            await renderFileList();
        });

        document.getElementById('cancelFolderBtn').addEventListener('click', () => {
            folderModal.classList.remove('show');
        });

        folderNameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('createFolderBtn').click();
            }
        });

        document.getElementById('cancelLabelBtn').addEventListener('click', () => {
            labelModal.classList.remove('show');
        });

        document.getElementById('saveLabelBtn').addEventListener('click', async () => {
            const label = labelInput.value.trim();
            if (!label) {
                showError('Label cannot be empty');
                return;
            }
            if (currentFileId) {
                await updateItem(currentFileId, { label });
                await renderFileList();
                currentFileNameEl.textContent = label;
            }
            labelModal.classList.remove('show');
        });

        labelInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('saveLabelBtn').click();
            }
        });

        downloadBtn.addEventListener('contextmenu', async (e) => {
            e.preventDefault();
            if (!currentFileId) return;
            const file = await getItemById(currentFileId);
            if (file) {
                labelInput.value = file.label;
                labelModal.classList.add('show');
                labelInput.focus();
            }
        });

        // Focus iframe on click to ensure keyboard events reach it
        htmlFrame.addEventListener('load', () => {
            htmlFrame.focus();
        });

        async function init() {
            try {
                await initDB();
                await renderFileList();
            } catch (error) {
                console.error('Failed to initialize:', error);
                showError('Failed to initialize storage');
            }
        }

        init();
    </script>
</body>
</html>
